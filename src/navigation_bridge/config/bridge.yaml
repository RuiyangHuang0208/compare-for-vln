topics:
  command: /vln/command
  odometry: /odom
  safe_velocity: /nav_vel

control_rate_hz: 20.0
command_timeout_s: 0.5

path_follower:
  lookahead_distance: 0.6
  waypoint_tolerance: 0.35
  heading_gain: 1.5

safety_filter:
  stop_on_timeout: true
  require_finite_values: true
  limits:
    vx: [-1.0, 1.0]
    vy: [-1.0, 1.0]
    yaw_rate: [-1.0, 1.0]
