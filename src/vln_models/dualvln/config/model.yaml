model:
  name: InternVLA-N1-DualVLN
  implementation: third_party/InternNav
  checkpoint: checkpoints/dualvln
  system1: nextdit_async
  service: src/vln_models/dualvln/sim_server.py
  status: simulation_ready

inputs:
  instruction:
    topic: /vln/instruction
    message_type: std_msgs/msg/String
  front_rgb:
    topic: /b2_366/sensor/front/camera_raw
    message_type: sensor_msgs/msg/Image
    encoding: rgb8
    simulation_scene_key: front_rgb
  depth:
    required_by_realworld_agent: true
    source: front_rgb/distance_to_image_plane
    aligned_with_rgb: true
    unit: m
  odometry:
    required_by_model: false
    simulation_source: robot/root_link_pos_w + heading_w

output:
  semantic_type: ego_centric_trajectory
  adapter: src/vln_interface/scripts/trajectory_adapter.py
  unified_topic: /vln/command
  unified_type: vln_interface/msg/NavigationCommand
  command_type: TRAJECTORY

runtime:
  asynchronous: true
  transport: http
  endpoint: http://127.0.0.1:5801
  attention_implementation: sdpa
  expected_speed_mps: 0.3
  max_speed_mps: 5.0
  upstream_controller_reference_max_speed_mps: 0.4
  locomotion_policy_vx_range_mps: [-1.0, 1.0]
  allow_out_of_distribution_speed_commands: true
  max_yaw_rate_radps: 0.4
  reject_stale_images: true
  stop_without_instruction: true
