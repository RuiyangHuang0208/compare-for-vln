# Shared simulated sensor contract. Model-specific experiments select a subset.
profile: b2w_vln_rgbd_sim

required:
  front_rgb:
    config: src/sensors/camera/config/b2_front_rgb.yaml
  aligned_depth:
    required_for_official_realworld_pipeline: true
  odometry:
    topic: /odom
    message_type: nav_msgs/msg/Odometry

simulation:
  front_rgb:
    config: src/sensors/camera/config/b2_front_rgb_sim.yaml
  aligned_depth_source: distance_to_image_plane
  odometry_source: isaaclab_articulation_root_state
  rgb_topic: /camera/rgb/image_raw
  depth_topic: /camera/depth/image_raw
  camera_info_topic: /camera/rgb/camera_info
  ground_truth_topic: /ground_truth/odom
  frame_id: camera_front_optical
  width: 640
  height: 480
  rate_hz: 10

evaluation_profiles:
  rgb_only: [front_rgb, odometry]
  rgb_d: [front_rgb, aligned_depth, odometry]
  rgb_d_pointcloud_from_depth: [front_rgb, aligned_depth, camera_info, odometry]
  rgb_d_lidar: [front_rgb, aligned_depth, lidar, odometry]

# These devices are not required for the simulation-only DualVLN pipeline.
not_model_inputs:
  rear_rgb: false
  lidar: false
  gnss: false
  body_imu: false

operational_safety:
  emergency_stop_topic: /b2_366/e_stop
  command_timeout_s: 0.5
