    goal_profile: language_only
    evaluation_mode: native_output
    supported_evaluation_modes: [native_output]
    direct_velocity: true
    local_avoidance: false
    external_local_avoidance: false
    use_native_controller: true
    use_native_locomotion: false
    comparison_track: omnivla_native
    model_inputs: [rgb, instruction]
    launch_arguments:
      goal_profile: language_only
      evaluation_mode: native_output
      direct_velocity: true
    runtime_metadata:
      variant: omnivla-original
      resume_step: 120000
      modality_id: 7
      action_shape: [8, 4]
      target_inference_rate_hz: 3.0
      native_waypoint_index: 4
      native_max_v: 0.3
      native_max_w: 0.3
    execution:
      launch_model: omnivla_native
      high_level_controller: adapter_native_velocity
      controller_fidelity: official_waypoint_4_pd_b2w_velocity_output
      source: third_party/OmniVLA/inference/run_omnivla.py
      upstream_repository: https://github.com/NHirose/OmniVLA
      upstream_commit: 5182600cb4a9ee07684e17cdd2a6cbafc56b8a68
      source_sha256: 6bdd78a3533449cc8f1be6c14365650e8504bc072abc85e0bdedc2d1030679d0
      evidence: official_waypoint_index_4_pd_dt_1over3_vmax_0.3_wmax_0.3
      official_controller_available: true
      adapter_deviation: Only the official high-level velocity conversion is reused; B2-W SRU-ONNX replaces the upstream robot low-level.
      camera_parameter_source: shared DynaNav benchmark camera; OmniVLA does not publish a benchmark HFOV
      camera_horizontal_fov_degrees: 90.0
      upstream_camera_resolution: null
      simulation_camera_resolution: [640, 480]
      model_image_resolution: [224, 224]
      desired_speed: 0.3
      official:
        controller: waypoint_4_pd
        waypoint_index: 4
        controller_dt: 0.3333333333
        preliminary_max_linear_speed: 0.5
        preliminary_max_angular_speed: 1.0
        final_max_linear_speed: 0.3
        final_max_angular_speed: 0.3
      navigation:
        lookahead_distance: 1.0
        goal_tolerance: 0.05
        yaw_gain: 0.8
        yaw_filter_alpha: 0.35
        curvature_feedforward_gain: 0.5
        max_vx: 0.3
        max_vy: 0.0
        max_wz: 0.3
        max_linear_acceleration: 2.0
        max_angular_acceleration: 3.0
        max_linear_deceleration: 2.5
        max_angular_deceleration: 3.5
        trajectory_timeout: 3.0
        recovery_speed: -0.3
        recovery_duration: 1.5

  aware_vln:
    package: aware_vln_adapter
    executable: aware_vln_adapter
    launch_file: aware_vln.launch.py
    output_type: waypoint
